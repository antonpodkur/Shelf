name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Shelf \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Shelf \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-test \
            -only-testing:ShelfTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test | xcbeautify

      - name: Package .app
        run: |
          mkdir -p artifact
          ditto -c -k --keepParent \
            "build/Build/Products/Release/Shelf.app" \
            "artifact/Shelf.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shelf-${{ github.sha }}
          path: artifact/Shelf.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/Shelf.zip
